name: Build FreeFire Aimlock Dylib

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create project structure
        run: |
          mkdir -p AimlockFreeFire
          cd AimlockFreeFire
          cat > AimlockFreeFire.c << 'EOF'
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <unistd.h>
          #include <sys/mman.h>
          #include <dlfcn.h>
          #include <pthread.h>

          // Offset từ global-metadata
          #define OFFSET_1 0x00080BD5
          #define OFFSET_2 0x000A8771
          #define OFFSET_3 0x001D4B8C

          // Pattern cần ghim
          unsigned char pattern1[] = {0x61, 0x6c, 0x63, 0x43, 0x68, 0x61, 0x74, 0x42, 0x75, 0x62, 0x62, 0x6c, 0x65, 0x50, 0x6f, 0x73, 0x28, 0x29, 0x3a, 0x20, 0x62, 0x6f, 0x6e, 0x65, 0x5f, 0x48, 0x65, 0x61, 0x64, 0x20};
          unsigned char pattern2[] = {0x61, 0x64, 0x43, 0x6f, 0x6d, 0x70, 0x6f, 0x6e, 0x65, 0x6e, 0x74, 0x20, 0x6e, 0x6f, 0x20, 0x66, 0x69, 0x6e, 0x64, 0x20, 0x62, 0x6f, 0x6e, 0x65, 0x5f, 0x48, 0x65, 0x61, 0x64, 0x20};
          unsigned char pattern3[] = {0x75, 0x6c, 0x6c, 0x2e, 0x62, 0x6f, 0x6e, 0x65, 0x57, 0x65, 0x69, 0x67, 0x68, 0x74, 0x73, 0x62, 0x6f, 0x6e, 0x65, 0x5f, 0x62, 0x6f, 0x6e, 0x65, 0x5f, 0x48, 0x65, 0x61, 0x64};

          // Hàm ghi đè bộ nhớ
          void patch_memory(void* target, unsigned char* pattern, size_t len) {
              if (target == NULL) return;
              size_t page_size = sysconf(_SC_PAGESIZE);
              uintptr_t page_start = (uintptr_t)target & ~(page_size - 1);
              if (mprotect((void*)page_start, page_size, PROT_READ | PROT_WRITE | PROT_EXEC) == 0) {
                  memcpy(target, pattern, len);
                  __builtin___clear_cache(target, (char*)target + len);
                  mprotect((void*)page_start, page_size, PROT_READ | PROT_EXEC);
              }
          }

          // Bypass antiban - xóa dấu hiệu debug
          void bypass_antiban() {
              // Disable thông báo lỗi và crash report
              setenv("MallocScribble", "0", 1);
              setenv("MallocStackLogging", "0", 1);
              setenv("NSZombieEnabled", "NO", 1);
              // Vô hiệu hóa ghi log
              FILE* dev_null = fopen("/dev/null", "w");
              if (dev_null) {
                  dup2(fileno(dev_null), 1);
                  dup2(fileno(dev_null), 2);
                  fclose(dev_null);
              }
          }

          // Hook aimlock
          void* aimlock_thread(void* arg) {
              // Chờ game load hoàn tất
              sleep(5);
              while (1) {
                  // Lấy base address của game
                  void* handle = dlopen(NULL, RTLD_NOW);
                  if (handle) {
                      Dl_info info;
                      if (dladdr(handle, &info)) {
                          uintptr_t base = (uintptr_t)info.dli_fbase;
                          // Áp dụng patch tại các offset
                          void* target1 = (void*)(base + OFFSET_1);
                          void* target2 = (void*)(base + OFFSET_2);
                          void* target3 = (void*)(base + OFFSET_3);
                          patch_memory(target1, pattern1, sizeof(pattern1));
                          patch_memory(target2, pattern2, sizeof(pattern2));
                          patch_memory(target3, pattern3, sizeof(pattern3));
                      }
                      dlclose(handle);
                  }
                  sleep(30);
              }
              return NULL;
          }

          // Constructor - chạy khi dylib được load
          __attribute__((constructor)) void init() {
              bypass_antiban();
              pthread_t thread;
              pthread_create(&thread, NULL, aimlock_thread, NULL);
              pthread_detach(thread);
          }
          EOF

      - name: Download fishhook
        run: |
          curl -L -o fishhook.c https://raw.githubusercontent.com/facebook/fishhook/master/fishhook.c
          curl -L -o fishhook.h https://raw.githubusercontent.com/facebook/fishhook/master/fishhook.h

      - name: List files (debug)
        run: |
          pwd
          ls -la AimlockFreeFire/
          ls -la

      - name: Build dylib
        run: |
          cd AimlockFreeFire
          clang -dynamiclib -arch arm64 -O2 -flto -fomit-frame-pointer \
                -mios-version-min=15.0 -isysroot /var/run/sdk \
                -framework Foundation -framework UIKit \
                -o AimlockFreeFire.dylib AimlockFreeFire.c ../fishhook.c
          # Nếu lỗi sysroot, dùng xcodebuild
          if [ $? -ne 0 ]; then
            SDKROOT=$(xcrun --sdk iphoneos --show-sdk-path)
            clang -dynamiclib -arch arm64 -O2 -flto -fomit-frame-pointer \
                  -mios-version-min=15.0 -isysroot $SDKROOT \
                  -framework Foundation -framework UIKit \
                  -o AimlockFreeFire.dylib AimlockFreeFire.c ../fishhook.c
          fi
          cd ..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AimlockFreeFire_dylib
          path: AimlockFreeFire/AimlockFreeFire.dylib 