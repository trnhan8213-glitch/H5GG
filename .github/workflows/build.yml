name: Build iOS dylib

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Create unlock.c
        run: |
          cat > unlock.c << 'EOF'
          #include <stdio.h>
          #include <dlfcn.h>
          #include <string.h>
          #include <mach/audit_token.h>
          #include <sandbox.h>
          #include "fishhook.h"

          int (*orig_sandbox_check)(const char *path, const char *operation, ...);
          int (*orig_sandbox_check_with_audit_token)(audit_token_t token, const char *path, const char *operation, ...);

          int my_sandbox_check(const char *path, const char *operation, ...) {
              return 0;
          }

          int my_sandbox_check_with_audit_token(audit_token_t token, const char *path, const char *operation, ...) {
              return 0;
          }

          __attribute__((constructor)) void init() {
              struct rebinding rebindings[] = {
                  {"sandbox_check", my_sandbox_check, (void *)&orig_sandbox_check},
                  {"sandbox_check_with_audit_token", my_sandbox_check_with_audit_token, (void *)&orig_sandbox_check_with_audit_token}
              };
              rebind_symbols(rebindings, 2);

              void *handle = dlopen("@loader_path/frida-gadget.dylib", RTLD_NOW);
              if (handle) {
                  void (*frida_init)(void) = dlsym(handle, "frida_init");
                  if (frida_init) frida_init();
              }
          }
          EOF

      - name: Download fishhook
        run: |
          curl -L -o fishhook.h https://raw.githubusercontent.com/facebook/fishhook/main/fishhook.h
          curl -L -o fishhook.c https://raw.githubusercontent.com/facebook/fishhook/main/fishhook.c

      - name: List files (debug)
        run: ls -la

      - name: Build dylib
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK path: $SDK_PATH"
          clang -arch arm64 \
                -isysroot $SDK_PATH \
                -dynamiclib \
                -miphoneos-version-min=12.0 \
                -Os \
                -Wno-implicit-function-declaration \
                -Wno-return-type \
                -o libunlock.dylib \
                unlock.c fishhook.c \
                2>&1 | tee build.log
          cat build.log
          ls -la libunlock.dylib || echo "File not found!"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libunlock
          path: libunlock.dylib
